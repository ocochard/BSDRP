# Poudriere settings specific to the BSDRPj jail.
#
# poudriere sources this file after poudriere.conf (see include_poudriere_confs()
# in /usr/local/share/poudriere/common.sh), so it overrides anything inherited.
# This matters because poudriere.etc/poudriere.conf is a symlink to the host's
# /usr/local/etc/poudriere.conf: whatever settings that machine happens to carry
# leak into BSDRP builds.
#
# Never substitute official binary packages for locally built ones. BSDRP builds
# its base system WITHOUT_KERBEROS, so packages from pkg.FreeBSD.org that link
# against base krb5 cannot be installed in the build jail (security/libssh
# defaults to GSSAPI_BASE, which breaks net/bird3 and, via rtrlib, net/frr10).
# Fetched packages also silently ignore the port options set in BSDRPj-make.conf.
PACKAGE_FETCH_BRANCH=
