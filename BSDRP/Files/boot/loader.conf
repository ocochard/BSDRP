#################################################################
# Don't modify this file !                                      #
# Your changes will not be preserved after an upgrade           #
# Create a /boot/loader.conf.local in place                     #
#                                                               #
#################################################################
#
loader_logo="none"	# Disable the loader logo
loader_brand="bsdrp"
loader_menu_title="Welcome to BSD Router Project"
autoboot_delay="2"	# Reduce the autoboot delay to 2 seconds
hw.vga.textmode="1"	# Text mode
# Wait up to 10s for GEOM_LABEL to taste the disk before giving up
# and dropping to mountroot>. Default of 3s is too short on some
# SATA controllers (observed on PC Engines APU2 with SATA SSDs).
vfs.mountroot.timeout="10"
